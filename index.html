<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Approval DApp (Trust Wallet Ready)</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
</head>
<body style="font-family:sans-serif; text-align:center; margin-top:50px;">
  <h2>Token Approval DApp</h2>

  <label>Token Contract Address:</label><br>
  <input id="tokenAddress" placeholder="Enter ERC20 token address" size="45"><br><br>

  <label>Spender Address:</label><br>
  <input id="spender" placeholder="Enter spender address" size="45"><br><br>

  <label>Amount to Approve:</label><br>
  <input id="amount" placeholder="Enter token amount" size="25"><br><br>

  <button id="connectBtn">Connect Wallet</button>
  <button id="approveBtn" disabled>Approve Tokens</button>

  <p id="status"></p>

  <script>
    let provider, signer;

    async function connectWallet() {
      if (window.ethereum) {
        try {
          await window.ethereum.request({ method: 'eth_requestAccounts' });
          provider = new ethers.providers.Web3Provider(window.ethereum);
          signer = provider.getSigner();
          document.getElementById('status').innerText = "Wallet connected!";
          document.getElementById('approveBtn').disabled = false;
        } catch (err) {
          document.getElementById('status').innerText = "Connection rejected.";
        }
      } else {
        document.getElementById('status').innerText =
          "Please open this page in Trust Wallet or MetaMask browser.";
      }
    }

    async function approveTokens() {
      const tokenAddress = document.getElementById('tokenAddress').value.trim();
      const spender = document.getElementById('spender').value.trim();
      const amount = document.getElementById('amount').value.trim();

      if (!tokenAddress || !spender || !amount) {
        alert("Please fill all fields.");
        return;
      }

      const erc20Abi = [
        "function approve(address spender, uint256 amount) public returns (bool)"
      ];

      const tokenContract = new ethers.Contract(tokenAddress, erc20Abi, signer);
      const decimals = 18; // adjust if token has different decimals
      const parsedAmount = ethers.utils.parseUnits(amount, decimals);

      try {
        const tx = await tokenContract.approve(spender, parsedAmount);
        document.getElementById('status').innerText = "Transaction sent: " + tx.hash;
      } catch (err) {
        document.getElementById('status').innerText = "Error: " + err.message;
      }
    }

    document.getElementById('connectBtn').onclick = connectWallet;
    document.getElementById('approveBtn').onclick = approveTokens;
  </script>
</body>
</html>
